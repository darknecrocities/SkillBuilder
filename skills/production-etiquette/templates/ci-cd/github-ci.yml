name: CI / Production Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Gate 1: Lint & Code Style
      - name: Run Linter & Style Checks
        run: npm run lint --if-present

      # Gate 2: Static Type Checking
      - name: Run Type Checking
        run: npx tsc --noEmit --skipLibCheck false

      # Gate 3: Automated Test Execution
      - name: Run Automated Test Suites
        run: npm test -- --coverage

      # Gate 4: Dependency Security Audit
      - name: Audit Dependencies for Known Vulnerabilities
        run: npm audit --audit-level=high

  docker-verification:
    name: Container Build & Health Validation
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Gate 5: Docker Container Build Check
      - name: Verify Production Docker Image Builds
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: app:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
