<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <!-- Background Chassis Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0d0e"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>

    <!-- Specular Hairline Highlight -->
    <linearGradient id="specularLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>

    <!-- Kinetic Shimmer Gradient -->
    <linearGradient id="kineticShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#94a3b8;#38bdf8;#ffffff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#34d399;#38bdf8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#94a3b8;#38bdf8;#ffffff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Telemetry Pulse Gradient -->
    <linearGradient id="telemetryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes kineticGlide {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    @keyframes sweepGlow {
      0% { stop-color: #38bdf8; }
      33% { stop-color: #818cf8; }
      66% { stop-color: #34d399; }
      100% { stop-color: #38bdf8; }
    }
    @keyframes borderPulse {
      0%, 100% { stroke: #27272a; }
      50% { stroke: #3f3f46; }
    }

    .pulse { animation: pulseDot 2s infinite ease-in-out; transform-origin: 865px 29px; }
    .kinetic-title { animation: kineticGlide 4s infinite ease-in-out; }
    .chassis { animation: borderPulse 6s infinite ease-in-out; }

    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "JetBrains Mono", "SF Pro Display", monospace, sans-serif;
    }
  </style>

  <!-- Outer Window Chassis with Drop Shadow -->
  <rect x="10" y="10" width="940" height="240" rx="14" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1" class="chassis" filter="url(#shadow)"/>
  
  <!-- Top Specular Highlight Edge -->
  <line x1="24" y1="11" x2="936" y2="11" stroke="url(#specularLine)" stroke-width="1"/>

  <!-- macOS Window Titlebar -->
  <rect x="10" y="10" width="940" height="38" rx="14" fill="#0e0f11"/>
  <rect x="10" y="34" width="940" height="14" fill="#0e0f11"/>
  <line x1="10" y1="48" x2="950" y2="48" stroke="#1f2023" stroke-width="1"/>

  <!-- Window Control Dots -->
  <circle cx="32" cy="29" r="5.5" fill="#ef4444"/>
  <circle cx="48" cy="29" r="5.5" fill="#f59e0b"/>
  <circle cx="64" cy="29" r="5.5" fill="#10b981"/>

  <!-- Titlebar Monospace Label -->
  <text x="480" y="33" fill="#71717a" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">
    SKILLBUILDER ARCHITECTURAL ENGINE // LIVE DEMONSTRATION
  </text>

  <!-- Live Status Badge -->
  <rect x="800" y="21" width="130" height="18" rx="4" fill="#18181b" stroke="#27272a"/>
  <circle cx="814" cy="30" r="3.5" fill="#10b981" class="pulse"/>
  <text x="826" y="33" fill="#a1a1aa" font-size="9" font-weight="700" letter-spacing="0.8">PURE RAW DEMO</text>

  <!-- Kinetic Title Text (Line 1) -->
  <g class="kinetic-title">
    <text x="480" y="98" fill="url(#kineticShimmer)" font-size="25" font-weight="800" text-anchor="middle" letter-spacing="2">
      SKILLBUILDER IN ACTION
    </text>
  </g>

  <!-- Kinetic Subtitle (Line 2) -->
  <text x="480" y="126" fill="#e2e8f0" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="0.5">
    Autonomous Two-Tier QA Remediation &amp; Multi-Viewport Telemetry
  </text>

  <!-- Telemetry Pills (Line 3) -->
  <g transform="translate(0, 148)">
    <!-- Pill 1: Gemini 3.8 Flash High -->
    <rect x="65" y="0" width="180" height="26" rx="6" fill="#121316" stroke="#27272a"/>
    <circle cx="80" cy="13" r="3" fill="#38bdf8"/>
    <text x="90" y="17" fill="#cbd5e1" font-size="10.5" font-weight="600" letter-spacing="0.3">GEMINI 3.8 FLASH HIGH</text>

    <!-- Pill 2: 107.35s Master -->
    <rect x="255" y="0" width="130" height="26" rx="6" fill="#121316" stroke="#27272a"/>
    <circle cx="270" cy="13" r="3" fill="#10b981"/>
    <text x="280" y="17" fill="#cbd5e1" font-size="10.5" font-weight="600" letter-spacing="0.3">107.35s MASTER</text>

    <!-- Pill 3: 4-Tier Viewport QA -->
    <rect x="395" y="0" width="155" height="26" rx="6" fill="#121316" stroke="#27272a"/>
    <circle cx="410" cy="13" r="3" fill="#f59e0b"/>
    <text x="420" y="17" fill="#cbd5e1" font-size="10.5" font-weight="600" letter-spacing="0.3">4-TIER VIEWPORT QA</text>

    <!-- Pill 4: 500-Line Limit Pass -->
    <rect x="560" y="0" width="155" height="26" rx="6" fill="#121316" stroke="#27272a"/>
    <circle cx="575" cy="13" r="3" fill="#818cf8"/>
    <text x="585" y="17" fill="#cbd5e1" font-size="10.5" font-weight="600" letter-spacing="0.3">500-LINE LIMIT PASS</text>

    <!-- Pill 5: Zero AI Slop -->
    <rect x="725" y="0" width="170" height="26" rx="6" fill="#121316" stroke="#27272a"/>
    <circle cx="740" cy="13" r="3" fill="#34d399"/>
    <text x="750" y="17" fill="#cbd5e1" font-size="10.5" font-weight="600" letter-spacing="0.3">ZERO MOCK DATA / SLOP</text>
  </g>

  <!-- Bottom Verification Footer -->
  <line x1="30" y1="198" x2="930" y2="198" stroke="#1f2023" stroke-width="1"/>
  <text x="480" y="222" fill="#52525b" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0.4">
    Google Antigravity &bull; Vite HMR Dev Server &bull; Automated Headless Puppeteer Snapshots &bull; Vitest Regression Suite
  </text>
</svg>
