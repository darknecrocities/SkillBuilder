<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%">
  <defs>
    <!-- Dark Chassis Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0d0e"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <!-- Specular Hairline Top Highlight -->
    <linearGradient id="specularLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    @keyframes cursorBlink {
      0%, 45%, 100% { opacity: 1; }
      50%, 95% { opacity: 0; }
    }
    @keyframes typingText {
      0% { width: 0; }
      20% { width: 560px; }
      100% { width: 560px; }
    }
    @keyframes phase1Card {
      0%, 20% { opacity: 0; transform: translateY(8px); }
      24%, 94% { opacity: 1; transform: translateY(0); }
      98%, 100% { opacity: 0; transform: translateY(-4px); }
    }
    @keyframes phase2Card {
      0%, 44% { opacity: 0; transform: translateY(8px); }
      48%, 94% { opacity: 1; transform: translateY(0); }
      98%, 100% { opacity: 0; transform: translateY(-4px); }
    }
    @keyframes phase3Gates {
      0%, 68% { opacity: 0; transform: translateY(8px); }
      72%, 94% { opacity: 1; transform: translateY(0); }
      98%, 100% { opacity: 0; transform: translateY(-4px); }
    }
    @keyframes progressPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .cursor { animation: cursorBlink 0.8s infinite; }
    .phase1 { animation: phase1Card 12s infinite ease-in-out; }
    .phase2 { animation: phase2Card 12s infinite ease-in-out; }
    .phase3 { animation: phase3Gates 12s infinite ease-in-out; }
    .pulse { animation: progressPulse 1.5s infinite; }

    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "JetBrains Mono", monospace, sans-serif;
    }
  </style>

  <!-- Outer Window Shadow & Chassis -->
  <rect x="10" y="10" width="860" height="440" rx="14" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1" filter="url(#shadow)"/>
  <!-- Specular Top Edge -->
  <line x1="24" y1="11" x2="856" y2="11" stroke="url(#specularLine)" stroke-width="1"/>

  <!-- macOS Window Titlebar -->
  <rect x="10" y="10" width="860" height="38" rx="14" fill="#0e0f11"/>
  <rect x="10" y="34" width="860" height="14" fill="#0e0f11"/>
  <line x1="10" y1="48" x2="870" y2="48" stroke="#1f2023" stroke-width="1"/>

  <!-- Window Control Dots -->
  <circle cx="32" cy="29" r="5.5" fill="#ef4444"/>
  <circle cx="48" cy="29" r="5.5" fill="#f59e0b"/>
  <circle cx="64" cy="29" r="5.5" fill="#10b981"/>

  <!-- Title & Status -->
  <text x="440" y="33" fill="#71717a" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">
    SKILLBUILDER ENGINE // UNIVERSAL AI WORKFLOW ARCHITECTURE
  </text>
  <rect x="760" y="21" width="94" height="16" rx="4" fill="#18181b" stroke="#27272a"/>
  <circle cx="770" cy="29" r="3" fill="#34d399" class="pulse"/>
  <text x="778" y="32" fill="#34d399" font-size="9" font-weight="700">LOOP: ACTIVE</text>

  <!-- Input Terminal Prompt Area -->
  <g transform="translate(30, 66)">
    <rect x="0" y="0" width="820" height="44" rx="8" fill="#121316" stroke="#27272a" stroke-width="1"/>
    <text x="14" y="27" fill="#f59e0b" font-size="12" font-weight="700">❯</text>
    <text x="32" y="27" fill="#a1a1aa" font-size="12" font-weight="500">
      <tspan fill="#38bdf8" font-weight="700">/plan</tspan> <tspan fill="#a78bfa" font-weight="700">/world-class-engineering</tspan> <tspan fill="#e4e4e7">Build an ultra-premium telemetry strip with fader &amp; detents</tspan>
    </text>
    <rect x="585" y="14" width="7" height="16" fill="#38bdf8" class="cursor"/>
  </g>

  <!-- Stage Cards Grid Container -->
  <!-- Phase 1: Metacognitive Prompt Polishing Engine (PPE) -->
  <g transform="translate(30, 126)" class="phase1">
    <rect x="0" y="0" width="260" height="236" rx="10" fill="#121316" stroke="#27272a" stroke-width="1"/>
    <!-- Card Header -->
    <rect x="0" y="0" width="260" height="32" rx="10" fill="#18191d"/>
    <rect x="0" y="22" width="260" height="10" fill="#18191d"/>
    <line x1="0" y1="32" x2="260" y2="32" stroke="#27272a" stroke-width="1"/>
    <circle cx="16" cy="16" r="3" fill="#a78bfa"/>
    <text x="26" y="20" fill="#d4d4d8" font-size="10" font-weight="700" letter-spacing="0.5">1. PROMPT POLISHED (/prompt-polish)</text>

    <!-- Card Body: Structured RFC Matrix -->
    <text x="14" y="56" fill="#71717a" font-size="9" font-weight="700">GOAL SPECIFICATION</text>
    <text x="14" y="74" fill="#f4f4f5" font-size="10" font-weight="500">Mastering-grade hardware channel strip</text>

    <text x="14" y="104" fill="#71717a" font-size="9" font-weight="700">EXPLICIT CONSTRAINTS</text>
    <text x="14" y="122" fill="#a1a1aa" font-size="10">• 500-line physical file ceiling</text>
    <text x="14" y="138" fill="#a1a1aa" font-size="10">• Zero mock data / real state</text>
    <text x="14" y="154" fill="#a1a1aa" font-size="10">• 120Hz native spring physics</text>

    <text x="14" y="184" fill="#71717a" font-size="9" font-weight="700">TARGET PLATFORMS</text>
    <rect x="14" y="194" width="76" height="18" rx="4" fill="#1e1b4b" stroke="#3730a3"/>
    <text x="52" y="206" fill="#a5b4fc" font-size="8.5" font-weight="700" text-anchor="middle">ANTIGRAVITY</text>

    <rect x="96" y="194" width="62" height="18" rx="4" fill="#1e1b4b" stroke="#3730a3"/>
    <text x="127" y="206" fill="#a5b4fc" font-size="8.5" font-weight="700" text-anchor="middle">CURSOR</text>

    <rect x="164" y="194" width="72" height="18" rx="4" fill="#1e1b4b" stroke="#3730a3"/>
    <text x="200" y="206" fill="#a5b4fc" font-size="8.5" font-weight="700" text-anchor="middle">CHATGPT</text>
  </g>

  <!-- Phase 2: Interactive Implementation Plan Artifact -->
  <g transform="translate(310, 126)" class="phase2">
    <rect x="0" y="0" width="260" height="236" rx="10" fill="#121316" stroke="#27272a" stroke-width="1"/>
    <!-- Card Header -->
    <rect x="0" y="0" width="260" height="32" rx="10" fill="#18191d"/>
    <rect x="0" y="22" width="260" height="10" fill="#18191d"/>
    <line x1="0" y1="32" x2="260" y2="32" stroke="#27272a" stroke-width="1"/>
    <circle cx="16" cy="16" r="3" fill="#38bdf8"/>
    <text x="26" y="20" fill="#d4d4d8" font-size="10" font-weight="700" letter-spacing="0.5">2. INTERACTIVE PLAN (/plan)</text>

    <!-- Card Body: Plan Specs -->
    <text x="14" y="56" fill="#71717a" font-size="9" font-weight="700">ARCHITECTURE &amp; MODULES</text>
    <text x="14" y="74" fill="#f4f4f5" font-size="10" font-weight="500">MachinedTitaniumStrip.tsx (&lt;300 lines)</text>
    <text x="14" y="90" fill="#a1a1aa" font-size="9.5">Framer Motion zero-re-render gestures</text>
    <text x="14" y="106" fill="#a1a1aa" font-size="9.5">Web Audio 1.2ms acoustic click impulse</text>

    <text x="14" y="136" fill="#71717a" font-size="9" font-weight="700">SUB-PIXEL LIGHTING MODEL</text>
    <text x="14" y="152" fill="#a1a1aa" font-size="9.5">1px top specular + ambient occlusion</text>

    <!-- Interactive Proceed Button -->
    <rect x="14" y="180" width="232" height="34" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <text x="130" y="201" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">
      PROCEED (USER APPROVED) ✓
    </text>
  </g>

  <!-- Phase 3: Automated Quality Verification & Git PR -->
  <g transform="translate(590, 126)" class="phase3">
    <rect x="0" y="0" width="260" height="236" rx="10" fill="#121316" stroke="#27272a" stroke-width="1"/>
    <!-- Card Header -->
    <rect x="0" y="0" width="260" height="32" rx="10" fill="#18191d"/>
    <rect x="0" y="22" width="260" height="10" fill="#18191d"/>
    <line x1="0" y1="32" x2="260" y2="32" stroke="#27272a" stroke-width="1"/>
    <circle cx="16" cy="16" r="3" fill="#34d399"/>
    <text x="26" y="20" fill="#d4d4d8" font-size="10" font-weight="700" letter-spacing="0.5">3. QUALITY GATES &amp; DELIVERY</text>

    <!-- Automated Gate Badges -->
    <g transform="translate(14, 46)">
      <rect x="0" y="0" width="232" height="26" rx="4" fill="#064e3b" stroke="#059669"/>
      <circle cx="12" cy="13" r="3" fill="#34d399"/>
      <text x="24" y="17" fill="#d1fae5" font-size="9.5" font-weight="600">[PASS] 500-Line Limit (74 files)</text>
    </g>

    <g transform="translate(14, 80)">
      <rect x="0" y="0" width="232" height="26" rx="4" fill="#064e3b" stroke="#059669"/>
      <circle cx="12" cy="13" r="3" fill="#34d399"/>
      <text x="24" y="17" fill="#d1fae5" font-size="9.5" font-weight="600">[PASS] 27 Test Suites Passing</text>
    </g>

    <g transform="translate(14, 114)">
      <rect x="0" y="0" width="232" height="26" rx="4" fill="#064e3b" stroke="#059669"/>
      <circle cx="12" cy="13" r="3" fill="#34d399"/>
      <text x="24" y="17" fill="#d1fae5" font-size="9.5" font-weight="600">[PASS] Commit Budget &lt; 1k lines</text>
    </g>

    <g transform="translate(14, 148)">
      <rect x="0" y="0" width="232" height="26" rx="4" fill="#064e3b" stroke="#059669"/>
      <circle cx="12" cy="13" r="3" fill="#34d399"/>
      <text x="24" y="17" fill="#d1fae5" font-size="9.5" font-weight="600">[PASS] Anti-Slop Cleanliness</text>
    </g>

    <!-- Ready PR Tag -->
    <rect x="14" y="186" width="232" height="28" rx="4" fill="#18181b" stroke="#3f3f46"/>
    <text x="130" y="204" fill="#e4e4e7" font-size="9" font-weight="700" text-anchor="middle">
      PR #5 UPDATED // RELEASE TAG v3.7.0
    </text>
  </g>

  <!-- Bottom Command Status Footer -->
  <g transform="translate(30, 386)">
    <rect x="0" y="0" width="820" height="38" rx="8" fill="#0e0f11" stroke="#1f2023"/>
    <circle cx="20" cy="19" r="4" fill="#f59e0b" class="pulse"/>
    <text x="32" y="23" fill="#a1a1aa" font-size="10.5" font-weight="600">
      CORE PROTOCOL: <tspan fill="#ffffff" font-weight="700">ALWAYS START WITH /plan</tspan> ➔ POLISH WITH <tspan fill="#ffffff" font-weight="700">/prompt-polish</tspan> ➔ EXECUTE ON ANY AI PLATFORM
    </text>
    <rect x="730" y="10" width="76" height="18" rx="4" fill="#18181b" stroke="#27272a"/>
    <text x="768" y="22" fill="#71717a" font-size="9" font-weight="700" text-anchor="middle">21 SKILLS</text>
  </g>
</svg>
